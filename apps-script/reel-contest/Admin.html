<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>#KayalReelFest Entries — Kayal Events</title>
  <style>
    :root {
      --bg: #07151a;
      --surface: #0e2329;
      --raised: #122d3a;
      --border: #1c3d4f;
      --sand: #fbf7ef;
      --muted: #8ab5cc;
      --lagoon: #2dba62;
      --ocean: #1aa3dc;
      --coral: #e8443b;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--sand);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 14px;
      line-height: 1.5;
      min-height: 100vh;
    }

    a { color: var(--ocean); text-decoration: none; }
    a:hover { text-decoration: underline; }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 40;
      background: rgba(7,21,26,0.9);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 12px 20px;
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    .topbar-brand {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .topbar-title { font-size: 15px; font-weight: 600; color: var(--sand); }

    .topbar-right {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .counts-bar {
      padding: 12px 20px;
      display: flex;
      gap: 20px;
      border-bottom: 1px solid var(--border);
      flex-wrap: wrap;
    }

    .count-item { display: flex; align-items: center; gap: 6px; font-size: 12px; }
    .count-dot { width: 8px; height: 8px; border-radius: 50%; }
    .count-n { font-weight: 600; color: var(--sand); font-size: 14px; }

    .controls {
      padding: 12px 20px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      border-bottom: 1px solid var(--border);
    }

    input[type=search], select {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--sand);
      font-size: 13px;
      padding: 7px 12px;
      outline: none;
      transition: border-color 0.15s;
    }
    input[type=search]:focus, select:focus { border-color: var(--ocean); }
    input[type=search] { min-width: 220px; }

    .btn {
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--raised);
      color: var(--sand);
      font-size: 12px;
      font-weight: 500;
      padding: 7px 14px;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
    }
    .btn:hover { border-color: var(--ocean); background: var(--surface); }
    .btn-sm { font-size: 11px; padding: 5px 10px; border-radius: 6px; }

    .table-wrap { overflow-x: auto; padding: 0 20px 20px; }

    table { width: 100%; border-collapse: collapse; margin-top: 16px; font-size: 13px; }

    thead th {
      text-align: left;
      padding: 8px 10px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--muted);
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }

    tbody tr { border-bottom: 1px solid var(--border); cursor: pointer; transition: background 0.1s; }
    tbody tr:hover { background: var(--raised); }
    tbody tr.selected { background: var(--raised); outline: 1px solid var(--ocean); }

    td { padding: 10px 10px; vertical-align: middle; }

    .team-badge {
      display: inline-block;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.04em;
      border-radius: 4px;
      padding: 2px 7px;
    }
    .team-Mohanlal { background: rgba(26,163,220,0.12); color: var(--ocean); }
    .team-Chithra { background: rgba(232,68,59,0.12); color: var(--coral); }

    .voucher-yes { color: var(--lagoon); font-size: 11px; }
    .name { font-weight: 600; color: var(--sand); max-width: 180px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .ts { font-size: 11px; color: var(--muted); white-space: nowrap; }

    .detail-overlay {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: flex;
      align-items: flex-start;
      justify-content: flex-end;
      pointer-events: none;
    }

    .detail-panel {
      width: min(560px, 100vw);
      height: 100vh;
      background: var(--surface);
      border-left: 1px solid var(--border);
      overflow-y: auto;
      pointer-events: all;
      transform: translateX(100%);
      transition: transform 0.25s ease;
    }
    .detail-panel.open { transform: translateX(0); }
    .detail-panel-inner { padding: 24px 20px 40px; }

    .detail-close {
      position: sticky;
      top: 0;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 12px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 1;
    }

    .detail-close-btn {
      background: none;
      border: none;
      color: var(--muted);
      font-size: 18px;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 4px;
    }
    .detail-close-btn:hover { color: var(--sand); background: var(--raised); }

    .section-label {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 6px;
      margin-top: 20px;
    }

    .detail-value { color: var(--sand); word-break: break-word; line-height: 1.6; white-space: pre-wrap; }

    .link-pill {
      display: inline-block;
      font-size: 12px;
      padding: 4px 10px;
      border: 1px solid var(--border);
      border-radius: 20px;
      color: var(--ocean);
      text-decoration: none;
      margin-top: 6px;
    }
    .link-pill:hover { border-color: var(--ocean); text-decoration: none; }

    .loading-msg { padding: 40px 20px; text-align: center; color: var(--muted); }
    .spinner {
      display: inline-block;
      width: 20px; height: 20px;
      border: 2px solid var(--border);
      border-top-color: var(--lagoon);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
      margin-right: 8px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .empty-msg { color: var(--muted); padding: 40px 20px; text-align: center; }

    @media (max-width: 600px) {
      thead th:nth-child(4), tbody td:nth-child(4) { display: none; }
      .controls { flex-direction: column; }
      input[type=search] { min-width: unset; width: 100%; }
      select { width: 100%; }
      .topbar { gap: 8px; padding: 10px 14px; }
      .table-wrap { padding: 0 12px 20px; }
      .counts-bar { padding: 10px 14px; gap: 14px; }
      .controls { padding: 10px 14px; }
    }
  </style>
</head>
<body>

  <!-- Topbar -->
  <div class="topbar">
    <span class="topbar-brand">Kayal Events</span>
    <span class="topbar-title">#KayalReelFest Entries</span>
    <div class="topbar-right">
      <button class="btn btn-sm" onclick="exportCSV()">Export CSV</button>
      <button class="btn btn-sm" onclick="loadEntries()">Refresh</button>
    </div>
  </div>

  <!-- Counts — doubles as the team scoreboard source for promo posts -->
  <div class="counts-bar" id="countsBar" style="display:none">
    <div class="count-item">
      <span class="count-dot" style="background:var(--muted)"></span>
      <span class="count-n" id="cntTotal">0</span>
      <span style="color:var(--muted)">total entries</span>
    </div>
    <div class="count-item">
      <span class="count-dot" style="background:var(--ocean)"></span>
      <span class="count-n" id="cntMohanlal">0</span>
      <span style="color:var(--muted)">Team Mohanlal</span>
    </div>
    <div class="count-item">
      <span class="count-dot" style="background:var(--coral)"></span>
      <span class="count-n" id="cntChithra">0</span>
      <span style="color:var(--muted)">Team Chithra</span>
    </div>
    <div class="count-item">
      <span class="count-dot" style="background:var(--lagoon)"></span>
      <span class="count-n" id="cntVoucher">0</span>
      <span style="color:var(--muted)">voucher-eligible (non-NSW)</span>
    </div>
  </div>

  <!-- Controls -->
  <div class="controls">
    <input type="search" id="searchInput" placeholder="Search name or email…" oninput="renderTable()" />
    <select id="teamFilter" onchange="renderTable()">
      <option value="">All teams</option>
      <option value="Mohanlal">Team Mohanlal</option>
      <option value="Chithra">Team Chithra</option>
    </select>
  </div>

  <!-- Table -->
  <div class="table-wrap">
    <div id="loadingMsg" class="loading-msg"><span class="spinner"></span>Loading entries…</div>
    <div id="emptyMsg" class="empty-msg" style="display:none">No entries match your filter.</div>
    <table id="table" style="display:none">
      <thead>
        <tr>
          <th>Name</th>
          <th>Team</th>
          <th>State</th>
          <th>Video</th>
          <th>Submitted</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>

  <!-- Detail panel -->
  <div class="detail-overlay" id="detailOverlay" onclick="handleOverlayClick(event)">
    <div class="detail-panel" id="detailPanel">
      <div class="detail-close">
        <span id="detailTitle" style="font-weight:600;font-size:15px;color:var(--sand)">—</span>
        <button class="detail-close-btn" onclick="closeDetail()" aria-label="Close">&times;</button>
      </div>
      <div class="detail-panel-inner" id="detailContent"></div>
    </div>
  </div>

  <script>
    var adminToken = <?!= JSON.stringify(adminToken) ?>;
    var allRows = [];
    var openEntryId = null;

    loadEntries();

    function loadEntries() {
      document.getElementById('loadingMsg').style.display = '';
      document.getElementById('table').style.display = 'none';
      document.getElementById('emptyMsg').style.display = 'none';
      document.getElementById('countsBar').style.display = 'none';

      google.script.run
        .withSuccessHandler(function(rows) {
          allRows = rows.sort(function(a, b) {
            return b.submitted_at.localeCompare(a.submitted_at);
          });
          updateCounts();
          renderTable();
          document.getElementById('loadingMsg').style.display = 'none';
          document.getElementById('countsBar').style.display = '';
        })
        .withFailureHandler(function(err) {
          document.getElementById('loadingMsg').textContent = 'Error: ' + err.message;
        })
        .getSubmissions(adminToken);
    }

    function updateCounts() {
      document.getElementById('cntTotal').textContent = allRows.length;
      document.getElementById('cntMohanlal').textContent =
        allRows.filter(function(r) { return r.team === 'Mohanlal'; }).length;
      document.getElementById('cntChithra').textContent =
        allRows.filter(function(r) { return r.team === 'Chithra'; }).length;
      document.getElementById('cntVoucher').textContent =
        allRows.filter(function(r) { return r.voucher_eligible === 'TRUE'; }).length;
    }

    function renderTable() {
      var q = document.getElementById('searchInput').value.toLowerCase();
      var tf = document.getElementById('teamFilter').value;

      var filtered = allRows.filter(function(r) {
        var matchQ = !q ||
          r.full_name.toLowerCase().includes(q) ||
          r.email.toLowerCase().includes(q);
        var matchTeam = !tf || r.team === tf;
        return matchQ && matchTeam;
      });

      var tbody = document.getElementById('tableBody');
      tbody.innerHTML = '';

      if (filtered.length === 0) {
        document.getElementById('table').style.display = 'none';
        document.getElementById('emptyMsg').style.display = '';
        return;
      }

      document.getElementById('emptyMsg').style.display = 'none';
      document.getElementById('table').style.display = '';

      filtered.forEach(function(row) {
        var tr = document.createElement('tr');
        if (row.entry_id === openEntryId) tr.className = 'selected';

        tr.innerHTML = [
          '<td><div class="name">' + esc(row.full_name) + '</div>' +
            '<div style="font-size:11px;color:var(--muted)">' + row.entry_id + '</div></td>',
          '<td><span class="team-badge team-' + row.team + '">' + row.team + '</span></td>',
          '<td>' + esc(row.state) +
            (row.voucher_eligible === 'TRUE' ? '<div class="voucher-yes">voucher-eligible</div>' : '') + '</td>',
          '<td><a href="' + esc(row.video_url) + '" target="_blank" rel="noopener">' + row.video_type + '</a></td>',
          '<td class="ts">' + formatTs(row.submitted_at) + '</td>',
        ].join('');

        tr.addEventListener('click', function() { openDetail(row); });
        tbody.appendChild(tr);
      });
    }

    function openDetail(row) {
      openEntryId = row.entry_id;
      renderTable();

      document.getElementById('detailTitle').textContent = row.full_name;

      var html = [
        '<div class="section-label">Reference</div>',
        '<div class="detail-value">' + row.entry_id + ' &nbsp;·&nbsp; Submitted ' + formatTs(row.submitted_at) + '</div>',

        '<div class="section-label">Team</div>',
        '<div class="detail-value"><span class="team-badge team-' + row.team + '">' + row.team + '</span></div>',

        '<div class="section-label">Contact</div>',
        '<div class="detail-value">' +
          '<a href="mailto:' + esc(row.email) + '">' + esc(row.email) + '</a><br>' +
          '<a href="tel:' + esc(row.phone) + '">' + esc(row.phone) + '</a><br>' +
          esc(row.state) + (row.voucher_eligible === 'TRUE' ? ' — voucher-eligible (non-NSW)' : ' — NSW, not voucher-eligible') +
        '</div>',

        row.description ? '<div class="section-label">Description</div>' : '',
        row.description ? '<div class="detail-value">' + esc(row.description) + '</div>' : '',

        '<div class="section-label">Video</div>',
        '<div class="detail-value">' +
          '<a class="link-pill" href="' + esc(row.video_url) + '" target="_blank" rel="noopener">Open ' + row.video_type + '</a>' +
        '</div>',
      ].join('\n');

      document.getElementById('detailContent').innerHTML = html;
      document.getElementById('detailPanel').classList.add('open');
    }

    function closeDetail() {
      document.getElementById('detailPanel').classList.remove('open');
      openEntryId = null;
      renderTable();
    }

    function handleOverlayClick(e) {
      if (e.target === document.getElementById('detailOverlay')) closeDetail();
    }

    function exportCSV() {
      var q = document.getElementById('searchInput').value.toLowerCase();
      var tf = document.getElementById('teamFilter').value;

      var rows = allRows.filter(function(r) {
        var matchQ = !q || r.full_name.toLowerCase().includes(q) || r.email.toLowerCase().includes(q);
        var matchTeam = !tf || r.team === tf;
        return matchQ && matchTeam;
      });

      var headers = [
        'entry_id','submitted_at','full_name','email','phone','state',
        'voucher_eligible','team','description','video_type','video_url',
        'tcs_accepted','status'
      ];

      var lines = [headers.join(',')];
      rows.forEach(function(r) {
        var cells = headers.map(function(h) {
          var v = String(r[h] || '').replace(/"/g, '""');
          return '"' + v + '"';
        });
        lines.push(cells.join(','));
      });

      var blob = new Blob([lines.join('\n')], { type: 'text/csv' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = 'kayal-reel-contest-' + new Date().toISOString().slice(0,10) + '.csv';
      a.click();
      URL.revokeObjectURL(url);
    }

    function esc(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function formatTs(iso) {
      if (!iso) return '—';
      try {
        return new Date(iso).toLocaleString('en-AU', {
          day: 'numeric', month: 'short', year: 'numeric',
          hour: '2-digit', minute: '2-digit', timeZoneName: 'short',
          timeZone: 'Australia/Sydney',
        });
      } catch (e) {
        return iso;
      }
    }

    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') closeDetail();
    });
  </script>
</body>
</html>
