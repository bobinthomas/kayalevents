<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EOI Panel — Kayal Events</title>
  <style>
    :root {
      --bg: #07151a;
      --surface: #0e2329;
      --raised: #122d3a;
      --border: #1c3d4f;
      --sand: #fbf7ef;
      --muted: #8ab5cc;
      --lagoon: #2dba62;
      --ocean: #1aa3dc;
      --coral: #e8443b;
      --coral-h: #ef5a52;
      --gold: #d4af6a;
      --pending: #8ab5cc;
      --shortlisted: #2dba62;
      --rejected: #e8443b;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--sand);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 14px;
      line-height: 1.5;
      min-height: 100vh;
    }

    a { color: var(--ocean); text-decoration: none; }
    a:hover { text-decoration: underline; }

    /* ── Layout ── */

    .topbar {
      position: sticky;
      top: 0;
      z-index: 40;
      background: rgba(7,21,26,0.9);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 12px 20px;
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    .topbar-brand {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .topbar-title {
      font-size: 15px;
      font-weight: 600;
      color: var(--sand);
    }

    .topbar-right {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .reviewer-email { font-size: 12px; color: var(--muted); }

    /* ── Counts ── */
    .counts-bar {
      padding: 12px 20px;
      display: flex;
      gap: 20px;
      border-bottom: 1px solid var(--border);
      flex-wrap: wrap;
    }

    .count-item { display: flex; align-items: center; gap: 6px; font-size: 12px; }
    .count-dot { width: 8px; height: 8px; border-radius: 50%; }
    .count-n { font-weight: 600; color: var(--sand); font-size: 14px; }

    /* ── Controls ── */
    .controls {
      padding: 12px 20px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      border-bottom: 1px solid var(--border);
    }

    input[type=search], select {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--sand);
      font-size: 13px;
      padding: 7px 12px;
      outline: none;
      transition: border-color 0.15s;
    }
    input[type=search]:focus, select:focus { border-color: var(--ocean); }
    input[type=search] { min-width: 220px; }

    .btn {
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--raised);
      color: var(--sand);
      font-size: 12px;
      font-weight: 500;
      padding: 7px 14px;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
    }
    .btn:hover { border-color: var(--ocean); background: var(--surface); }
    .btn-lagoon { background: var(--lagoon); border-color: var(--lagoon); color: #fff; }
    .btn-lagoon:hover { background: #3fcf72; border-color: #3fcf72; }
    .btn-reject { background: var(--coral); border-color: var(--coral); color: #fff; }
    .btn-reject:hover { background: var(--coral-h); border-color: var(--coral-h); }
    .btn-sm { font-size: 11px; padding: 5px 10px; border-radius: 6px; }

    /* ── Table ── */

    .table-wrap {
      overflow-x: auto;
      padding: 0 20px 20px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 16px;
      font-size: 13px;
    }

    thead th {
      text-align: left;
      padding: 8px 10px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--muted);
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }

    tbody tr {
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      transition: background 0.1s;
    }
    tbody tr:hover { background: var(--raised); }
    tbody tr.selected { background: var(--raised); outline: 1px solid var(--ocean); }

    td { padding: 10px 10px; vertical-align: middle; }

    .status-badge {
      display: inline-block;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      border-radius: 4px;
      padding: 2px 7px;
    }
    .status-Pending { background: rgba(138,181,204,0.12); color: var(--pending); }
    .status-Shortlisted { background: rgba(45,186,98,0.12); color: var(--shortlisted); }
    .status-Rejected { background: rgba(232,68,59,0.12); color: var(--rejected); }

    .group-name { font-weight: 600; color: var(--sand); max-width: 180px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .ts { font-size: 11px; color: var(--muted); white-space: nowrap; }

    /* ── Detail panel ── */

    .detail-overlay {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: flex;
      align-items: flex-start;
      justify-content: flex-end;
      pointer-events: none;
    }

    .detail-panel {
      width: min(560px, 100vw);
      height: 100vh;
      background: var(--surface);
      border-left: 1px solid var(--border);
      overflow-y: auto;
      pointer-events: all;
      transform: translateX(100%);
      transition: transform 0.25s ease;
    }

    .detail-panel.open { transform: translateX(0); }

    .detail-panel-inner { padding: 24px 20px 40px; }

    .detail-close {
      position: sticky;
      top: 0;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 12px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 1;
    }

    .detail-close-btn {
      background: none;
      border: none;
      color: var(--muted);
      font-size: 18px;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 4px;
    }
    .detail-close-btn:hover { color: var(--sand); background: var(--raised); }

    .section-label {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 6px;
      margin-top: 20px;
    }

    .detail-value {
      color: var(--sand);
      word-break: break-word;
      line-height: 1.6;
      white-space: pre-wrap;
    }

    .code-box {
      display: inline-block;
      background: var(--bg);
      border: 1px solid var(--ocean);
      border-radius: 8px;
      padding: 10px 20px;
      font-family: monospace;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 0.18em;
      color: var(--ocean);
      margin: 6px 0;
    }

    .link-list { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
    .link-pill {
      font-size: 12px;
      padding: 4px 10px;
      border: 1px solid var(--border);
      border-radius: 20px;
      color: var(--ocean);
      text-decoration: none;
      transition: border-color 0.15s;
    }
    .link-pill:hover { border-color: var(--ocean); text-decoration: none; }

    .status-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }

    textarea.notes-field {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--sand);
      font-size: 13px;
      line-height: 1.5;
      padding: 10px 12px;
      resize: vertical;
      min-height: 80px;
      outline: none;
      font-family: inherit;
      margin-top: 8px;
    }
    textarea.notes-field:focus { border-color: var(--lagoon); }

    .save-notes-btn { margin-top: 8px; }

    .toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--raised);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 20px;
      font-size: 13px;
      color: var(--sand);
      z-index: 100;
      opacity: 0;
      transition: opacity 0.2s;
      pointer-events: none;
    }
    .toast.show { opacity: 1; }

    /* ── Loading / empty ── */
    .loading-msg { padding: 40px 20px; text-align: center; color: var(--muted); }
    .spinner {
      display: inline-block;
      width: 20px; height: 20px;
      border: 2px solid var(--border);
      border-top-color: var(--lagoon);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
      margin-right: 8px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .empty-msg { color: var(--muted); padding: 40px 20px; text-align: center; }
  </style>
</head>
<body>

  <!-- Topbar -->
  <div class="topbar">
    <span class="topbar-brand">Kayal Events</span>
    <span class="topbar-title">EOI Panel</span>
    <div class="topbar-right">
      <span class="reviewer-email" id="reviewerEmail">…</span>
      <button class="btn btn-sm" onclick="exportCSV()">Export CSV</button>
      <button class="btn btn-sm" onclick="loadSubmissions()">Refresh</button>
    </div>
  </div>

  <!-- Counts -->
  <div class="counts-bar" id="countsBar" style="display:none">
    <div class="count-item">
      <span class="count-dot" style="background:var(--muted)"></span>
      <span class="count-n" id="cntTotal">0</span>
      <span style="color:var(--muted)">total</span>
    </div>
    <div class="count-item">
      <span class="count-dot" style="background:var(--pending)"></span>
      <span class="count-n" id="cntPending">0</span>
      <span style="color:var(--muted)">pending</span>
    </div>
    <div class="count-item">
      <span class="count-dot" style="background:var(--shortlisted)"></span>
      <span class="count-n" id="cntShortlisted">0</span>
      <span style="color:var(--muted)">shortlisted</span>
    </div>
    <div class="count-item">
      <span class="count-dot" style="background:var(--rejected)"></span>
      <span class="count-n" id="cntRejected">0</span>
      <span style="color:var(--muted)">rejected</span>
    </div>
  </div>

  <!-- Controls -->
  <div class="controls">
    <input type="search" id="searchInput" placeholder="Search group name…" oninput="renderTable()" />
    <select id="statusFilter" onchange="renderTable()">
      <option value="">All statuses</option>
      <option value="Pending">Pending</option>
      <option value="Shortlisted">Shortlisted</option>
      <option value="Rejected">Rejected</option>
    </select>
  </div>

  <!-- Table -->
  <div class="table-wrap">
    <div id="loadingMsg" class="loading-msg">
      <span class="spinner"></span>Loading submissions…
    </div>
    <div id="emptyMsg" class="empty-msg" style="display:none">No submissions match your filter.</div>
    <table id="table" style="display:none">
      <thead>
        <tr>
          <th>Group</th>
          <th>Performers</th>
          <th>Contact</th>
          <th>Status</th>
          <th>Submitted</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>

  <!-- Detail panel -->
  <div class="detail-overlay" id="detailOverlay" onclick="handleOverlayClick(event)">
    <div class="detail-panel" id="detailPanel">
      <div class="detail-close">
        <span id="detailTitle" style="font-weight:600;font-size:15px;color:var(--sand)">—</span>
        <button class="detail-close-btn" onclick="closeDetail()" aria-label="Close">&times;</button>
      </div>
      <div class="detail-panel-inner" id="detailContent"></div>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <script>
    var adminToken = <?!= JSON.stringify(adminToken) ?>;
    var allRows = [];
    var openSubmissionId = null;

    // ── Init ─────────────────────────────────────────────────────────────────

    google.script.run
      .withSuccessHandler(function(email) {
        document.getElementById('reviewerEmail').textContent = email;
      })
      .getReviewerEmail(adminToken);

    loadSubmissions();

    function loadSubmissions() {
      document.getElementById('loadingMsg').style.display = '';
      document.getElementById('table').style.display = 'none';
      document.getElementById('emptyMsg').style.display = 'none';
      document.getElementById('countsBar').style.display = 'none';

      google.script.run
        .withSuccessHandler(function(rows) {
          allRows = rows.sort(function(a, b) {
            return b.submitted_at.localeCompare(a.submitted_at);
          });
          updateCounts();
          renderTable();
          document.getElementById('loadingMsg').style.display = 'none';
          document.getElementById('countsBar').style.display = '';
        })
        .withFailureHandler(function(err) {
          document.getElementById('loadingMsg').textContent = 'Error: ' + err.message;
        })
        .getSubmissions(adminToken);
    }

    // ── Counts ───────────────────────────────────────────────────────────────

    function updateCounts() {
      document.getElementById('cntTotal').textContent = allRows.length;
      document.getElementById('cntPending').textContent =
        allRows.filter(function(r) { return r.status === 'Pending'; }).length;
      document.getElementById('cntShortlisted').textContent =
        allRows.filter(function(r) { return r.status === 'Shortlisted'; }).length;
      document.getElementById('cntRejected').textContent =
        allRows.filter(function(r) { return r.status === 'Rejected'; }).length;
    }

    // ── Table rendering ───────────────────────────────────────────────────────

    function renderTable() {
      var q = document.getElementById('searchInput').value.toLowerCase();
      var sf = document.getElementById('statusFilter').value;

      var filtered = allRows.filter(function(r) {
        var matchName = !q || r.group_name.toLowerCase().includes(q);
        var matchStatus = !sf || r.status === sf;
        return matchName && matchStatus;
      });

      var tbody = document.getElementById('tableBody');
      tbody.innerHTML = '';

      if (filtered.length === 0) {
        document.getElementById('table').style.display = 'none';
        document.getElementById('emptyMsg').style.display = '';
        return;
      }

      document.getElementById('emptyMsg').style.display = 'none';
      document.getElementById('table').style.display = '';

      filtered.forEach(function(row) {
        var tr = document.createElement('tr');
        if (row.submission_id === openSubmissionId) tr.className = 'selected';

        tr.innerHTML = [
          '<td><div class="group-name">' + esc(row.group_name) + '</div>' +
            '<div style="font-size:11px;color:var(--muted)">' + row.submission_id + '</div></td>',
          '<td>' + esc(row.num_performers) + '</td>',
          '<td>' +
            '<div>' + esc(row.contact_name) + '</div>' +
            '<div style="font-size:11px;color:var(--muted)">' + esc(row.contact_email) + '</div>' +
          '</td>',
          '<td><span class="status-badge status-' + row.status + '">' + row.status + '</span></td>',
          '<td class="ts">' + formatTs(row.submitted_at) + '</td>',
        ].join('');

        tr.addEventListener('click', function() { openDetail(row); });
        tbody.appendChild(tr);
      });
    }

    // ── Detail panel ──────────────────────────────────────────────────────────

    function openDetail(row) {
      openSubmissionId = row.submission_id;
      renderTable(); // re-render to mark selected

      document.getElementById('detailTitle').textContent = row.group_name;

      var links = [];
      if (row.link_instagram) links.push({ label: 'Instagram', url: row.link_instagram });
      if (row.link_youtube) links.push({ label: 'YouTube', url: row.link_youtube });
      if (row.link_other) links.push({ label: 'Other', url: row.link_other });

      var html = [
        // Reference
        '<div class="section-label">Reference</div>',
        '<div class="detail-value">' + row.submission_id + ' &nbsp;·&nbsp; Submitted ' + formatTs(row.submitted_at) + '</div>',

        // Group details
        '<div class="section-label" style="margin-top:18px">About the group</div>',
        '<div class="detail-value">' + esc(row.profile_about) + '</div>',

        '<div class="section-label">Achievements</div>',
        '<div class="detail-value">' + esc(row.achievements) + '</div>',

        '<div class="section-label">Performers</div>',
        '<div class="detail-value">' + esc(row.num_performers) + '</div>',

        // Contact
        '<div class="section-label">Contact</div>',
        '<div class="detail-value">',
        esc(row.contact_name) + '<br>' +
        '<a href="mailto:' + esc(row.contact_email) + '">' + esc(row.contact_email) + '</a><br>' +
        '<a href="tel:' + esc(row.contact_phone) + '">' + esc(row.contact_phone) + '</a>' +
        (row.location ? '<br>' + esc(row.location) : ''),
        '</div>',

        // Performance links
        links.length ? '<div class="section-label">Performance links</div>' : '',
        links.length ? '<div class="link-list">' +
          links.map(function(l) {
            return '<a href="' + esc(l.url) + '" target="_blank" rel="noopener" class="link-pill">' + esc(l.label) + '</a>';
          }).join('') +
          '</div>' : '',

        // Status actions
        '<div class="section-label" style="margin-top:24px">Review decision</div>',
        '<div class="status-actions">',
        '  <button class="btn btn-lagoon btn-sm" onclick="setStatus(\'' + row.submission_id + '\', \'Shortlisted\')">Shortlist</button>',
        '  <button class="btn btn-reject btn-sm" onclick="setStatus(\'' + row.submission_id + '\', \'Rejected\')">Reject</button>',
        '  <button class="btn btn-sm" onclick="setStatus(\'' + row.submission_id + '\', \'Pending\')">Reset to Pending</button>',
        '</div>',
        '<div style="font-size:11px;color:var(--muted);margin-top:6px">',
        row.reviewed_by
          ? 'Last updated by ' + esc(row.reviewed_by) + ' at ' + formatTs(row.reviewed_at)
          : 'Not yet reviewed.',
        '</div>',

        // Notes
        '<div class="section-label" style="margin-top:20px">Reviewer notes</div>',
        '<textarea id="notesField" class="notes-field" placeholder="Internal notes visible to the panel only…">' + esc(row.reviewer_notes) + '</textarea>',
        '<button class="btn btn-sm save-notes-btn" onclick="saveNotes(\'' + row.submission_id + '\')">Save notes</button>',
      ].join('\n');

      document.getElementById('detailContent').innerHTML = html;
      document.getElementById('detailPanel').classList.add('open');
    }

    function closeDetail() {
      document.getElementById('detailPanel').classList.remove('open');
      openSubmissionId = null;
      renderTable();
    }

    function handleOverlayClick(e) {
      if (e.target === document.getElementById('detailOverlay')) closeDetail();
    }

    // ── Status update ─────────────────────────────────────────────────────────

    function setStatus(submissionId, status) {
      var notes = document.getElementById('notesField')
        ? document.getElementById('notesField').value
        : '';

      google.script.run
        .withSuccessHandler(function() {
          showToast('Status set to ' + status);
          // Update local data
          var row = allRows.find(function(r) { return r.submission_id === submissionId; });
          if (row) {
            row.status = status;
            row.reviewer_notes = notes;
          }
          updateCounts();
          renderTable();
          // Re-open with fresh data
          if (row) openDetail(row);
        })
        .withFailureHandler(function(err) {
          showToast('Error: ' + err.message);
        })
        .updateSubmission(submissionId, status, notes, adminToken);
    }

    function saveNotes(submissionId) {
      var notes = document.getElementById('notesField').value;
      var row = allRows.find(function(r) { return r.submission_id === submissionId; });
      var currentStatus = row ? row.status : 'Pending';

      google.script.run
        .withSuccessHandler(function() {
          showToast('Notes saved.');
          if (row) row.reviewer_notes = notes;
        })
        .withFailureHandler(function(err) {
          showToast('Error: ' + err.message);
        })
        .updateSubmission(submissionId, currentStatus, notes, adminToken);
    }

    // ── CSV Export ────────────────────────────────────────────────────────────

    function exportCSV() {
      var q = document.getElementById('searchInput').value.toLowerCase();
      var sf = document.getElementById('statusFilter').value;

      var rows = allRows.filter(function(r) {
        var matchName = !q || r.group_name.toLowerCase().includes(q);
        var matchStatus = !sf || r.status === sf;
        return matchName && matchStatus;
      });

      var headers = [
        'submission_id','submitted_at','group_name','num_performers',
        'contact_name','contact_email','contact_phone','location',
        'link_instagram','link_youtube','link_other',
        'status','reviewer_notes','reviewed_by','reviewed_at'
      ];

      var lines = [headers.join(',')];
      rows.forEach(function(r) {
        var cells = headers.map(function(h) {
          var v = String(r[h] || '').replace(/"/g, '""');
          return '"' + v + '"';
        });
        lines.push(cells.join(','));
      });

      var blob = new Blob([lines.join('\n')], { type: 'text/csv' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = 'kayal-eoi-' + new Date().toISOString().slice(0,10) + '.csv';
      a.click();
      URL.revokeObjectURL(url);
    }

    // ── Utilities ─────────────────────────────────────────────────────────────

    function esc(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function formatTs(iso) {
      if (!iso) return '—';
      try {
        return new Date(iso).toLocaleString('en-AU', {
          day: 'numeric', month: 'short', year: 'numeric',
          hour: '2-digit', minute: '2-digit', timeZoneName: 'short',
          timeZone: 'Australia/Sydney',
        });
      } catch (e) {
        return iso;
      }
    }

    var toastTimer;
    function showToast(msg) {
      var t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(function() { t.classList.remove('show'); }, 2500);
    }

    // Close panel on Escape
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') closeDetail();
    });
  </script>
</body>
</html>
